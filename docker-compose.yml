services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    # Host port is for debugging only (e.g. psql from your laptop);
    # containers talk to postgres:5432 internally.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      # In-container connection strings override .env localhost defaults.
      DATABASE_URL: "postgresql://sdr:sdr@postgres:5432/sdr?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q '\"database\":true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql://sdr:sdr@postgres:5432/sdr?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # App runs migrations in its entrypoint; starting the worker after the
      # app is healthy guarantees the schema exists (no concurrent migrate race).
      app: { condition: service_healthy }
    # Real liveness signal: workers/index.ts refreshes /tmp/worker-heartbeat on
    # every successful consumer-loop pass (idle polls included). Sustained
    # Redis/processing failures skip the heartbeat → unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat 2>/dev/null || echo 0) )) -lt 45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
