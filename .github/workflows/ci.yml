name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sdr
          POSTGRES_PASSWORD: sdr
          POSTGRES_DB: sdr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdr -d sdr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Ephemeral CI-only credentials (fresh service per run, never production).
      DATABASE_URL: "postgresql://sdr:sdr@localhost:5432/sdr?schema=public"
      TEST_DATABASE_URL: "postgresql://sdr:sdr@localhost:5432/sdr?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
